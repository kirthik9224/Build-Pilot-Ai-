server.port=8080

# Primary DataSource: MySQL (running on localhost:3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/buildpilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:NewPassword@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Init (Run only if needed, ignore failures when already created)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Security & JWT
buildpilot.jwt.secret=${BUILDPILOT_JWT_SECRET:BuildPilotSecretKeyForJwtAuthenticationProduction2026SecureKey!}
buildpilot.jwt.expiration-ms=86400000

# AI Configuration (Real LLM integration with fallback graceful detection)
buildpilot.ai.provider=${BUILDPILOT_AI_PROVIDER:gemini}
buildpilot.ai.gemini-api-key=${GEMINI_API_KEY:}
buildpilot.ai.openai-api-key=${OPENAI_API_KEY:}
buildpilot.ai.model=${BUILDPILOT_AI_MODEL:gemini-1.5-flash}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
